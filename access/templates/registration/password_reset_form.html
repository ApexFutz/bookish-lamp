{% extends "base.html" %}
{% block title %}Reset password · bookish-lamp{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-xl font-semibold mb-2">Reset password</h1>
  <p class="text-sm text-slate-600 mb-4">Enter your email and we'll send a reset link.</p>
  <form method="post" class="space-y-3 rounded-lg border bg-white p-5 shadow-sm">
    {% csrf_token %}
    <input type="email" name="email" required placeholder="you@example.com"
           class="w-full rounded border border-slate-300 px-3 py-2 text-base">
    <button class="w-full rounded bg-sky-600 px-3 py-2 text-white font-medium hover:bg-sky-700">Send reset link</button>
  </form>
  <p class="mt-3 text-xs text-slate-500"><a href="{% url 'login' %}" class="hover:text-sky-600">Back to log in</a></p>
</div>
{% endblock %}
