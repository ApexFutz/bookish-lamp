{% extends "base.html" %}
{% block title %}Change password · bookish-lamp{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-xl font-semibold mb-4">Change password</h1>
  <form method="post" class="space-y-3 rounded-lg border bg-white p-5 shadow-sm">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<p class="mt-1 text-xs text-red-700">{{ e }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button class="w-full rounded bg-sky-600 px-3 py-2 text-white font-medium hover:bg-sky-700">Update password</button>
  </form>
</div>
{% endblock %}
