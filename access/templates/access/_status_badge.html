{% if status == "valid" %}
  <span class="rounded-full bg-emerald-100 px-2 py-1 text-xs font-medium text-emerald-800">Valid</span>
{% elif status == "expiring" %}
  <span class="rounded-full bg-amber-100 px-2 py-1 text-xs font-medium text-amber-800">Expiring</span>
{% elif status == "expired" %}
  <span class="rounded-full bg-red-100 px-2 py-1 text-xs font-medium text-red-800">Expired</span>
{% elif status == "revoked" %}
  <span class="rounded-full bg-slate-200 px-2 py-1 text-xs font-medium text-slate-700">Revoked</span>
{% else %}
  <span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-medium text-slate-400">—</span>
{% endif %}
